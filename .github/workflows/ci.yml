name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.7"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check linting
        run: uvx ruff check anime_extensions anime_extensions_api tests --output-format=github

      - name: Check formatting
        run: uvx ruff format --check anime_extensions anime_extensions_api tests

  type-check:
    name: Type check and compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Type check
        run: uv run mypy anime_extensions anime_extensions_api --ignore-missing-imports

      - name: Check bytecode compilation
        run: uv run python -m compileall -q anime_extensions anime_extensions_api

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run tests
        run: uv run pytest --junitxml=junit/test-results.xml -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: junit/test-results.xml
          if-no-files-found: warn
          retention-days: 7

  test-live:
    name: Live tests (${{ matrix.source }})
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [aniwaves, anikoto, mkissa, full_pipeline]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run live tests
        run: >-
          uv run pytest tests/live/test_live_${{ matrix.source }}.py
          --run-live --tb=short --maxfail=3 -v

      - name: Upload live-test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-logs-${{ matrix.source }}
          path: |
            **/*.log
            **/pytest-*.log
          if-no-files-found: ignore
          retention-days: 7

  build-package:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-unit]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv run --with twine twine check dist/*

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Build container
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: anisource-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Verify Docker image imports
        run: >-
          docker run --rm anisource-api:${{ github.sha }}
          python -c "import anime_extensions; import anime_extensions_api"

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: anisource-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-unit, test-live, build-package, docker-build]
    if: always()
    steps:
      - name: Require all checks to pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs failed or were cancelled."
          exit 1
      - name: Success
        run: echo "All pipelines passed successfully!"
