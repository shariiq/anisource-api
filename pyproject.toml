[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anisource-api"
version = "0.3.0"
description = "Modern Python SDK and FastAPI backend for anime sources and extractors with catalogue-driven plugin discovery, centralized HTTP client, and single-flight caching."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Anime Extensions Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "m3u8>=6.0.0",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.52.4",
    "uvloop>=0.21.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[project.scripts]
anime-api = "anime_extensions_api.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["anime_extensions", "anime_extensions_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
