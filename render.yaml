services:
  - type: web
    name: anime-extensions-api
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn anime_extensions_api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANIME_API_DEBUG
        value: "false"
      - key: ANIME_API_CACHE_ENABLED
        value: "true"
